openapi: 3.1.0
info:
  title: Team Rota API
  version: 0.1.0
  description: >-
    The public interface of Team Rota, defined before any implementation. Every operation carries an
    operationId <domain>.<action>, x-story traceability, x-roles from the permissions matrix, and named
    examples (x-synthetic: true) that the mock server serves and consumer tests use.
servers:
  - url: http://127.0.0.1:8000
    description: local (loopback only at test time)
tags: []
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    Problem:
      title: Problem
      description: A refusal or failure, with an enumerated reason tests can assert.
      type: object
      required: [type, title, reason]
      properties:
        type: { type: string, title: Type, description: A URI reference identifying the problem class., example: "about:blank" }
        title: { type: string, title: Title, description: A short human-readable summary., example: "Swap refused" }
        detail: { type: string, title: Detail, description: What happened, in one sentence., example: "The counterpart is not assigned to this shift." }
        reason: { type: string, title: Reason, description: The enumerated reason code., example: "counterpart_not_assigned" }
