        assignment_id: { type: integer, title: Assignment id, description: An assignment the caller holds on a published week., example: 101, x-when-to-use: from the board's holders }
        counterpart_id: { type: integer, title: Counterpart id, description: An active member other than the caller who holds no slot on that shift., example: 4, x-when-to-use: from identity.list_members }
        reason: { type: string, title: Reason, description: "Why the shift is handed over: sick, family, travel or other — checked by swaps (reason_required, invalid_reason), a string on purpose", example: sick, x-values: [sick, family, travel, other], x-when-to-use: other when none fits }
    Answer:
      title: Answer
      description: The counterpart's accept or decline, with a reason when declining.
