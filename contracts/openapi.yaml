        week: { allOf: [ { $ref: '#/components/schemas/Week' } ], title: Week, description: The week shown., example: { start_date: "2026-11-09", state: published } }
        shifts: { type: array, title: Shifts, description: Every shift of the week by date, start, then shift id (or only the caller's with mine)., example: [], items: { $ref: '#/components/schemas/BoardShift' } }
    SwapRequestCreate:
      title: New swap request
