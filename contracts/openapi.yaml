      type: object
      required: [date]
      properties:
        date: { type: string, format: date, title: Date, description: The shift's date, within the week., example: "2026-11-09" }
        start: { type: string, title: Start, description: Start time of day (HH:MM)., example: "08:00" }
        end: { type: string, title: End, description: End time of day (HH:MM), after start and at most 23:59., example: "14:00" }
        slots: { type: integer, title: Slots, description: How many members the shift needs; at least 1., example: 2, x-when-to-use: the number of holders when full }
    Assignment:
      title: Assignment
      description: A member holding one slot of a shift.
      type: object
      required: [id, shift_id, member_id]
      properties:
        id: { type: integer, title: Id, description: The assignment's id., example: 101, x-when-to-use: what a swap request names }
        shift_id: { type: integer, title: Shift id, description: The shift held., example: 11, x-when-to-use: to find the shift on the board }
        member_id: { type: integer, title: Member id, description: The holder., example: 2, x-when-to-use: the current holder }
    AssignmentCreate:
      title: New assignment
      description: The member to assign.
      type: object
      required: [member_id]
      properties:
        member_id: { type: integer, title: Member id, description: An active member., example: 2, x-when-to-use: from identity.list_members }
    Holder:
      title: Holder
      description: One holder-row of a shift, as the board shows it, ordered by assignment id, with the open request on that assignment and whether the caller may request a swap on it now.
      type: object
      required: [assignment_id, member_id, name, pending, requestable]
      properties:
        assignment_id: { type: integer, title: Assignment id, description: The assignment the holder holds., example: 101, x-when-to-use: what a swap request names }
        member_id: { type: integer, title: Member id, description: The holder (an inactive member still shows)., example: 2, x-when-to-use: the current holder }
        name: { type: string, title: Name, description: The holder's display name., example: Mo }
        pending: { type: [string, 'null'], title: Pending, description: requested or accepted when an open request exists on this assignment; null otherwise (declined, refused, approved, expired or none). Never anything that looks done., example: requested, enum: [requested, accepted, null], x-when-to-use: "show the text as it is; null shows nothing" }
        requestable: { type: boolean, title: Requestable, description: True only on the caller's own row of a published week while now < the deadline by the server's clock and no request is open on it; computed by swaps, never in the browser., example: false }
    Weeks:
      title: Weeks
      description: The weeks that exist and the current one.
      type: object
      required: [current, weeks]
      properties:
        current: { type: [string, 'null'], format: date, title: Current week, description: The latest published week whose start_date is on or before today by the clock; null when none., example: "2026-11-09" }
        weeks: { type: array, title: Weeks, description: Newest first by start_date; members see published weeks only., example: [], items: { $ref: '#/components/schemas/Week' } }
    BoardShift:
      title: Board shift
