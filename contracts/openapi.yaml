        shift: { allOf: [ { $ref: '#/components/schemas/Shift' } ], title: Shift, description: The shift., example: { id: 11, week_start: "2026-11-09", date: "2026-11-09", start: "08:00", end: "14:00", slots: 2 } }
        holders: { type: array, title: Holders, description: Who holds it, by assignment id., example: [ { assignment_id: 101, member_id: 2, name: Mo, pending: null, requestable: false } ], items: { $ref: '#/components/schemas/Holder' } }
    Board:
