[project]
name = "app"
version = "0.1.0"
description = "Team Rota"
requires-python = ">=3.12"
# Nothing may be added here without a DECISIONS.md row (hard rule 2); the roster lives in design/ARCHITECTURE.md.
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.scripts]
app = "app.cli:main"   # the operator's commands (ADU-11 seed-admin, ADU-15 serve)

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
  "calibration: measures a distribution, a rate, a frontier or a budget (fast tier excludes)",
  "timing: a wall-clock budget arm (never gates; also calibration)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "PTH"]   # PTH: every path through pathlib (hard rule 5)
